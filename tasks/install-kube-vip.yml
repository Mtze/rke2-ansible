---
- name: Ensure rke2 manifest auto install dir exists
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests/
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags:
    - install
    - kube-vip

- name: Deploy RBAC manifest (Necessary for kube-vip to be able to run as daemonset)
  become: true
  ansible.builtin.get_url:
    url: "{{ kube_vip_rbac_manifest_url }}"
    dest: /var/lib/rancher/rke2/server/manifests/kube-vip-rbac.yaml
    mode: '0644'
    owner: root
    group: root
    validate_certs: true
  retries: 3
  delay: 5
  tags:
    - install
    - kube-vip
    - download

- name: Deploy kube-vip manifest
  become: true
  ansible.builtin.template:
    src: kube-vip.yml.j2
    dest: /var/lib/rancher/rke2/server/manifests/kube-vip-cp.yaml
    owner: root
    group: root
    mode: '0644'
  tags:
    - install
    - kube-vip
    - configure
