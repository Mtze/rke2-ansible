---

# RKE2 ships kubectl at exactly its own Kubernetes version, so a link never skews.
- name: Link the kubectl shipped with RKE2
  become: true
  ansible.builtin.file:
    src: /var/lib/rancher/rke2/bin/kubectl
    dest: /usr/local/bin/kubectl
    state: link
    force: true
  tags:
    - install
    - kubectl

- name: Ensure .kube folder is present for root user
  become: true
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags:
    - install
    - kubectl

# Agents get only the kubelet credentials, which see their own node. An admin config has no place on a worker.
- name: Point root's kubectl at the local kubeconfig
  become: true
  ansible.builtin.file:
    src: "{{ '/etc/rancher/rke2/rke2.yaml' if rke2_node_type == 'server' else '/var/lib/rancher/rke2/agent/kubelet.kubeconfig' }}"
    dest: /root/.kube/config
    state: link
    force: true
  tags:
    - install
    - kubectl
