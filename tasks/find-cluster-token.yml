---
# Every host asks for itself. run_once would hang the decision on the first host of the play,
# and that host may still hold a token from an earlier play while the others have none.
- name: Find the cluster token
  when:
    - cluster_token is not defined or not cluster_token
  tags:
    - always
  block:
    # Ask a fixed server instead of the first play host, with --limit <pool> the play holds only agents.
    - name: Fetch cluster token from the first server
      become: true
      ansible.builtin.slurp:
        src: "{{ rke2_server_data_dir }}/node-token"
      delegate_to: "{{ rke2_first_server }}"
      register: remote_token
      no_log: true
      tags:
        - always

    - name: Store the cluster token
      ansible.builtin.set_fact:
        cluster_token: "{{ remote_token['content'] | b64decode | trim }}"
      no_log: true
      tags:
        - always

  rescue:
    - name: Warn about cluster token retrieval failure
      ansible.builtin.debug:
        msg: "WARNING: Could not retrieve cluster token from {{ rke2_first_server }}."
      tags:
        - always

# Follows the link to the server token on a cluster that has no agent token yet, so an
# agent always gets a token the servers accept and moves over once they have restarted.
- name: Fetch the agent join token from the first server
  become: true
  ansible.builtin.slurp:
    src: "{{ rke2_server_data_dir }}/agent-token"
  delegate_to: "{{ rke2_first_server }}"
  register: remote_agent_token
  failed_when: false
  no_log: true
  when: rke2_node_type == "agent"
  tags:
    - always

- name: Store the agent join token
  ansible.builtin.set_fact:
    rke2_agent_join_token: "{{ remote_agent_token.content | default('') | b64decode | trim }}"
  no_log: true
  when: rke2_node_type == "agent"
  tags:
    - always

# A config without a token would restart the node into a state where it cannot join.
- name: Stop before writing a config without a token
  ansible.builtin.assert:
    that: cluster_token | default('', true) | length > 0
    fail_msg: "No cluster token found. Set cluster_token or make sure {{ rke2_first_server }} is a running server of this cluster."
    quiet: true
  tags:
    - always
