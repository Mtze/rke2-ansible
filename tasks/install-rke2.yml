---
- name: Ensure rancher directory exists
  become: true
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags:
    - install
    - configure

- name: Show variable contents for rke2 config
  ansible.builtin.debug:
    msg: |
      Variable - control_plane_server       {{ control_plane_server }}
      Variable - control_plane_vip          {{ control_plane_vip }}
      Variable - control_plane_vip_hostname {{ control_plane_vip_hostname }}
  when:
    - debug_output
  tags:
    - configure

- name: Deploy the audit policy
  become: true
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/rancher/rke2/audit-policy.yaml
    owner: root
    group: root
    mode: '0600'
  when:
    - rke2_node_type == "server"
    - rke2_audit_log
  notify: Restart RKE2 service
  tags:
    - configure

- name: Deploy rancher rke2 config
  become: true
  ansible.builtin.template:
    src: rke2_config.yml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: '0600'
  diff: false  # the config holds the cluster token
  notify: Restart RKE2 service
  tags:
    - configure

- name: What will be installed to the node?
  ansible.builtin.debug:
    var: rke2_node_type
  when:
    - debug_output
  tags:
    - install

- name: Install RKE2 on a new node
  ansible.builtin.import_tasks: run-install-script.yml
  when: rke2_installed_version | length == 0

- name: Prepare the node for the CIS profile
  ansible.builtin.import_tasks: prepare-cis.yml
  when: rke2_cis_profile | length > 0

# RKE2 only allows one node to be in learner state - Hence we need to start one node after the other!
- name: Enable and start RKE2 service
  become: true
  ansible.builtin.service:
    name: "rke2-{{ rke2_node_type }}"
    state: started
    enabled: true
  throttle: 1
  tags:
    - install

- name: Fetch kube config file
  become: true
  ansible.builtin.fetch:
    src: /etc/rancher/rke2/rke2.yaml
    dest: "{{ local_kube_config_path }}"
    flat: true
  run_once: true
  delegate_facts: true
  when:
    - rke2_node_type == "server"
    - fetch_kube_config
    - local_kube_config_path is defined
    - local_kube_config_path | length > 0
  tags:
    - configure

- name: Point the fetched kubeconfig at the control plane VIP
  ansible.builtin.replace:
    path: "{{ local_kube_config_path }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ control_plane_vip_hostname | default(control_plane_vip, true) }}:6443"
    mode: '0600'
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - rke2_node_type == "server"
    - fetch_kube_config
    - local_kube_config_path is defined
    - local_kube_config_path | length > 0
    - control_plane_vip | default('', true) | length > 0
  tags:
    - configure
