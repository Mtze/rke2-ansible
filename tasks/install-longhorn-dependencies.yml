---

- name: Install Longhorn dependencies
  become: true
  ansible.builtin.package:
    name:
      - nfs-common
      - open-iscsi
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  tags:
    - install
    - longhorn

- name: Warn if OS family is not supported for Longhorn dependencies
  ansible.builtin.debug:
    msg: "WARNING: Longhorn dependency installation is only configured for Debian-based systems. Your OS family is {{ ansible_os_family }}. Please install nfs-common and open-iscsi equivalents manually."
  when: ansible_os_family != "Debian"
  tags:
    - install
    - longhorn
